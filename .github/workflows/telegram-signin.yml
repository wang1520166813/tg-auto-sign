name: Telegram Auto Sign-in

on:
  workflow_dispatch:
  schedule:
    - cron: '30 16 * * *'

concurrency:
  group: telegram-signin
  cancel-in-progress: false

jobs:
  sign-in:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Validate requirements.txt
        run: |
          test -s requirements.txt
          echo "requirements.txt 检查通过"
      - name: Install dependencies
        run: pip install --cache-dir ~/.cache/pip -r requirements.txt
      - name: Run Telegram Sign-in
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          SIGN_LIST_JSON: ${{ secrets.SIGN_LIST_JSON }}
        run: python main.py
      - name: Final Summary
        if: always()
        run: echo "运行状态：${{ job.status }}"
